# Render Blueprint for the API (New > Blueprint in the Render dashboard).
# The database lives on Neon (free, does not expire). Paste its connection string as DATABASE_URL.
services:
  - type: web
    name: campus-helpdesk-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false      # paste your Neon connection string when Render asks
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false      # your Vercel URL, e.g. https://campus-helpdesk.vercel.app
